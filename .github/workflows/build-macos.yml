name: Build macOS apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple-Silicon
            dmg_name: ClariusRawDownloader-macOS-Apple-Silicon.dmg
          - runner: macos-15-intel
            label: Intel
            dmg_name: ClariusRawDownloader-macOS-Intel.dmg

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install architecture-matched Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright-browsers"
          export PLAYWRIGHT_SKIP_BROWSER_GC=1
          python -m playwright install chromium

      - name: Run source tests
        run: |
          python -m unittest discover -s tests -v
          python app.py --self-test

      - name: Import Apple Developer ID certificate when configured
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/clarius-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "MACOS_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"

      - name: Build macOS application bundle
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright-browsers"
          export PLAYWRIGHT_SKIP_BROWSER_GC=1
          python -m PyInstaller --clean --noconfirm ClariusRawDownloader-macos.spec

      - name: Apply hardened Developer ID signature when configured
        if: ${{ env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            dist/ClariusRawDownloader.app

      - name: Test application bundle
        run: |
          dist/ClariusRawDownloader.app/Contents/MacOS/ClariusRawDownloader --self-test
          dist/ClariusRawDownloader.app/Contents/MacOS/ClariusRawDownloader --browser-self-test
          codesign --verify --deep --strict --verbose=2 dist/ClariusRawDownloader.app

      - name: Create DMG
        env:
          DMG_NAME: ${{ matrix.dmg_name }}
        run: |
          mkdir -p dist/dmg-root
          ditto dist/ClariusRawDownloader.app dist/dmg-root/ClariusRawDownloader.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Clarius RAW Data Downloader" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/$DMG_NAME"
          if [ -n "$MACOS_CODESIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "dist/$DMG_NAME"
          fi
          if [ -n "$MACOS_CODESIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool submit "dist/$DMG_NAME" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "dist/$DMG_NAME"
            xcrun stapler validate "dist/$DMG_NAME"
          fi
          hdiutil verify "dist/$DMG_NAME"

      - name: Upload macOS download
        uses: actions/upload-artifact@v4
        with:
          name: ClariusRawDownloader-macOS-${{ matrix.label }}
          path: dist/${{ matrix.dmg_name }}
          if-no-files-found: error
